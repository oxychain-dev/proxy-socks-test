name: tmp-v020-verify

on:
  push:
    branches:
      - feature/proxy-list-validation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve locked dependencies
        run: cargo generate-lockfile
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Check
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Controlled interface/SQLite smoke
        run: python3 tests/batch_smoke.py target/debug/proxy-socks-test
      - name: Version check
        run: |
          test "$(target/debug/proxy-socks-test --version)" = "proxy-socks-test 0.2.0"
      - name: Diff check
        run: git diff --check
      - name: Commit generated lockfile and formatting
        run: |
          if [[ -z "$(git status --porcelain -- Cargo.lock src tests)" ]]; then
            echo "No generated or formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src tests
          git commit -m "build: lock v0.2.0 dependencies and formatting"
          git push origin HEAD:feature/proxy-list-validation
