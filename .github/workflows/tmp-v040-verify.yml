name: tmp-v040-verify

on:
  push:
    branches:
      - feature/proxy-list-validation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Check
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Existing controlled batch smoke
        run: python3 tests/batch_smoke.py target/debug/proxy-socks-test
      - name: Controlled subscription/service smoke
        run: python3 tests/subscription_smoke.py target/debug/proxy-socks-test
      - name: CLI command help
        run: |
          target/debug/proxy-socks-test subscription --help
          target/debug/proxy-socks-test service --help
          test "$(target/debug/proxy-socks-test --version)" = "proxy-socks-test 0.4.0"
      - name: Verify systemd service example
        run: |
          sudo useradd --system --home-dir /var/lib/proxy-socks-test --shell /usr/sbin/nologin proxy-socks-test
          sudo install -d -o proxy-socks-test -g proxy-socks-test -m 0750 /var/lib/proxy-socks-test
          sudo ln -sf "$PWD/target/debug/proxy-socks-test" /usr/local/bin/proxy-socks-test
          systemd-analyze verify examples/proxy-socks-test.service
      - name: Diff check
        run: git diff --check
      - name: Commit generated lockfile and formatting
        run: |
          if [[ -z "$(git status --porcelain -- Cargo.lock src tests)" ]]; then
            echo "No generated or formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src tests
          git commit -m "build: lock v0.4.0 subscription phase and formatting"
          git push origin HEAD:feature/proxy-list-validation
