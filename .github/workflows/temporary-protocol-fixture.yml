name: Temporary protocol fixture verification

on:
  push:
    branches:
      - feature/proxy-list-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          python3 --version
      - name: Install lint components
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build binary
        run: cargo build
      - name: Controlled batch smoke test
        run: python3 tests/batch_smoke.py target/debug/proxy-socks-test
      - name: Diff sanity
        run: git diff --check
